<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT Flashcards</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f4f9; color: #333; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; cursor: pointer; min-height: 150px; display: flex; align-items: center; justify-content: center; font-size: 1.2em; margin-bottom: 20px; }
        .status { font-size: 0.9em; color: #666; margin-bottom: 15px; }
        button { padding: 10px 20px; font-size: 1em; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>ENT Flashcards</h1>
    <div id="status" class="status">Checking connection...</div>
    
    <div id="flashcard-container" style="display:none;">
        <div id="topic-badge" style="font-weight: bold; color: #007bff; margin-bottom: 10px;"></div>
        <div class="card" id="card" onclick="flipCard()">Click to load session</div>
        <button id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>

    <script>
        const TOPICS = ["General ENT", "Ear", "Nose", "Throat", "H&N"];
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyIzYQU9u9i2ov9O4Ye1sLh98OL55m6TsFDEMM1y3eeExe2V1XCJEmb94yEgc4gNdaO/exec";
        
        let sessionQuestions = [];
        let currentIndex = 0;
        let showingAnswer = false;

        async function initApp() {
            const statusEl = document.getElementById("status");
            let questions = [];

            try {
                // Try fetching live data from Google Sheets API
                const response = await fetch(WEB_APP_URL);
                if (!response.ok) throw new Error("Network response failed");
                questions = await response.json();
                
                // Save to localStorage for offline use
                localStorage.setItem("ent_flashcards", JSON.stringify(questions));
                statusEl.innerHTML = "🟢 Online: Synced with Google Sheets.";
            } catch (error) {
                // Fallback to offline storage if fetch fails
                const cachedData = localStorage.getItem("ent_flashcards");
                if (cachedData) {
                    questions = JSON.parse(cachedData);
                    statusEl.innerHTML = "🟠 Offline: Using last saved version from Google Sheets.";
                } else {
                    statusEl.innerHTML = "🔴 Offline and no cached data available. Please connect to the internet once.";
                    return;
                }
            }

            document.getElementById("flashcard-container").style.display = "block";
            startNewSession(questions);
        }

        function startNewSession(allQuestions) {
            sessionQuestions = [];
            
            // Pick 1 random question for each of the 5 topics
            TOPICS.forEach(topic => {
                const topicQuestions = allQuestions.filter(q => q.topic.trim().toLowerCase() === topic.toLowerCase());
                if (topicQuestions.length > 0) {
                    const randomQ = topicQuestions[Math.floor(Math.random() * topicQuestions.length)];
                    sessionQuestions.push(randomQ);
                }
            });

            // Shuffle the 5 session questions
            sessionQuestions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            showCurrentQuestion();
        }

        function showCurrentQuestion() {
            if (sessionQuestions.length === 0) {
                document.getElementById("card").innerText = "No questions found matching your 5 topics.";
                return;
            }
            
            if (currentIndex >= sessionQuestions.length) {
                document.getElementById("topic-badgeCumm") = "";
                document.getElementById("card").innerText = "Session complete! Reloading new session...";
                setTimeout(() => initApp(), 2000);
                return;
            }

            const currentQ = sessionQuestions[currentIndex];
            document.getElementById("topic-badge").innerText = `Topic: ${currentQ.topic} (${currentIndex + 1}/5)`;
            document.getElementById("card").innerText = currentQ.question;
            showingAnswer = false;
        }

        function flipCard() {
            if (sessionQuestions.length === 0) return;
            const currentQ = sessionQuestions[currentIndex];
            if (!showingAnswer) {
                document.getElementById("card").innerText = currentQ.answer;
                showingAnswer = true;
            } else {
                document.getElementById("card").innerText = currentQ.question;
                showingAnswer = false;
            }
        }

        function nextQuestion() {
            currentIndex++;
            showCurrentQuestion();
        }

        // Initialize on load
        window.onload = initApp;

        // Register Service Worker for PWA Offline Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered successfully:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
